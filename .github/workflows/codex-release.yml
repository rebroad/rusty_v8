name: codex-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Rusty V8 release tag to upload assets to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-x64-musl:
    name: Build sandbox x86_64 musl
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      V8_FROM_SOURCE: true
      TARGET: x86_64-unknown-linux-musl
      LIB_NAME: librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-musl.a.gz
      BINDING_NAME: src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-musl.rs
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dsherret/rust-toolchain-file@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install musl toolchain and sysroot
        run: |
          set -euo pipefail
          rustup target add "${TARGET}"
          sudo apt-get update -y
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-21.list >/dev/null
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-21 libclang-21-dev musl-tools musl-dev
          SYSROOT="${HOME}/musl-sysroot"
          mkdir -p "${SYSROOT}/usr/include" "${SYSROOT}/usr/lib"
          cp -a /usr/include/x86_64-linux-musl/. "${SYSROOT}/usr/include/"
          cp -a /usr/lib/x86_64-linux-musl/. "${SYSROOT}/usr/lib/"
          cp -a /usr/include/linux /usr/include/asm-generic /usr/include/x86_64-linux-gnu/asm "${SYSROOT}/usr/include/"
          cp -a /usr/include/x86_64-linux-gnu/bits/wordsize.h "${SYSROOT}/usr/include/bits/"
          cat > "${SYSROOT}/usr/include/sys/cdefs.h" <<'EOF'
          #ifndef _RUSTY_V8_MUSL_COMPAT_CDEFS_H
          #define _RUSTY_V8_MUSL_COMPAT_CDEFS_H
          #define __GNUC_PREREQ(maj, min) ((__GNUC__ << 16) + __GNUC_MINOR__ >= ((maj) << 16) + (min))
          #define __glibc_clang_prereq(maj, min) (__clang_major__ > (maj) || (__clang_major__ == (maj) && __clang_minor__ >= (min)))
          #define __glibc_has_attribute(attr) __has_attribute(attr)
          #define __glibc_has_builtin(name) __has_builtin(name)
          #define __glibc_has_extension(ext) __has_extension(ext)
          #endif
          EOF
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "${GITHUB_ENV}"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_MUSL_SYSROOT=${SYSROOT}" >> "${GITHUB_ENV}"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "${GITHUB_ENV}"
      - name: Install V8 sysroot
        run: python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
      - name: Build sandbox release artifacts
        run: |
          set -euo pipefail
          cargo build -vv --locked --release --target "${TARGET}" --features v8_enable_sandbox
          gzip -9c "target/${TARGET}/release/gn_out/obj/librusty_v8.a" > "${LIB_NAME}"
          cp "target/${TARGET}/release/gn_out/src_binding.rs" "${BINDING_NAME}"
          sha256sum "${LIB_NAME}" "${BINDING_NAME}" > "rusty_v8_ptrcomp_sandbox_release_${TARGET}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: codex-x64-musl-assets
          path: |
            ${{ env.LIB_NAME }}
            ${{ env.BINDING_NAME }}
            rusty_v8_ptrcomp_sandbox_release_${{ env.TARGET }}.sha256
          if-no-files-found: error

  build-android:
    name: Build sandbox Android arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      V8_FROM_SOURCE: true
      TARGET: aarch64-linux-android
      ANDROID_NDK_REVISION: r28c
      ANDROID_NDK_VERSION: 28.2.13676358
      RELEASE_LIB_NAME: librusty_v8_release_aarch64-linux-android.a.gz
      RELEASE_BINDING_NAME: src_binding_release_aarch64-linux-android.rs
      LIB_NAME: librusty_v8_ptrcomp_sandbox_release_aarch64-linux-android.a.gz
      BINDING_NAME: src_binding_ptrcomp_sandbox_release_aarch64-linux-android.rs
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dsherret/rust-toolchain-file@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends unzip
          ndk_home="${RUNNER_TEMP}/android-ndk-${ANDROID_NDK_REVISION}"
          if [[ ! -x "${ndk_home}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++" ]]; then
            curl -fsSL \
              "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_REVISION}-linux.zip" \
              -o "${RUNNER_TEMP}/android-ndk.zip"
            unzip -q -o "${RUNNER_TEMP}/android-ndk.zip" -d "${RUNNER_TEMP}"
          fi
          test -x "${ndk_home}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"
      - name: Install host Clang for bindgen
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-21.list >/dev/null
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-21 libclang-21-dev
      - name: Build Android sandbox artifacts
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${TARGET}"
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
          mkdir -p third_party/android_toolchain
          ln -sfn "${ANDROID_NDK_HOME}" third_party/android_ndk
          ln -sfn ../android_ndk third_party/android_toolchain/ndk
          config_gni=build/config/android/config.gni
          if ! grep -Fq 'android_ndk_version =' "${config_gni}"; then
            sed -i \
              "s#\(  android_ndk_root = \"//third_party/android_toolchain/ndk\"\)#\1\n  android_ndk_version = \"r28\"#" \
              "${config_gni}"
          fi
          clang_dir="${RUNNER_TEMP}/rusty-v8-clang"
          python3 tools/clang/scripts/update.py --output-dir "${clang_dir}"
          test -x "${clang_dir}/bin/clang"
          export CLANG_BASE_PATH="${clang_dir}"
          export LIBCLANG_PATH=/usr/lib/llvm-21/lib
          export ANDROID_API_LEVEL=29
          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          export CC_aarch64_linux_android=aarch64-linux-android29-clang
          export CXX_aarch64_linux_android=aarch64-linux-android29-clang++
          export AR_aarch64_linux_android=llvm-ar
          export RANLIB_aarch64_linux_android=llvm-ranlib
          linker="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${linker}"
          cargo build -vv --locked --release --target "${TARGET}"
          gzip -9c "target/${TARGET}/release/gn_out/obj/librusty_v8.a" > "${RELEASE_LIB_NAME}"
          cp "target/${TARGET}/release/gn_out/src_binding.rs" "${RELEASE_BINDING_NAME}"
          sha256sum "${RELEASE_LIB_NAME}" "${RELEASE_BINDING_NAME}" > "rusty_v8_release_${TARGET}.sha256"
          cargo build -vv --locked --release --target "${TARGET}" --features v8_enable_sandbox
          gzip -9c "target/${TARGET}/release/gn_out/obj/librusty_v8.a" > "${LIB_NAME}"
          cp "target/${TARGET}/release/gn_out/src_binding.rs" "${BINDING_NAME}"
          sha256sum "${LIB_NAME}" "${BINDING_NAME}" > "rusty_v8_ptrcomp_sandbox_release_${TARGET}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: codex-android-assets
          path: |
            ${{ env.RELEASE_LIB_NAME }}
            ${{ env.RELEASE_BINDING_NAME }}
            rusty_v8_release_${{ env.TARGET }}.sha256
            ${{ env.LIB_NAME }}
            ${{ env.BINDING_NAME }}
            rusty_v8_ptrcomp_sandbox_release_${{ env.TARGET }}.sha256
          if-no-files-found: error

  build-armv7:
    name: Build ARMv7 release
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      V8_FROM_SOURCE: true
      TARGET: armv7-unknown-linux-gnueabihf
      RELEASE_LIB_NAME: librusty_v8_release_armv7-unknown-linux-gnueabihf.a.gz
      RELEASE_BINDING_NAME: src_binding_release_armv7-unknown-linux-gnueabihf.rs
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dsherret/rust-toolchain-file@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ARMv7 cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${TARGET}"
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf pkg-config
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "${GITHUB_ENV}"
      - name: Install host Clang for bindgen
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-21.list >/dev/null
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-21 libclang-21-dev
      - name: Build ARMv7 release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
          clang_dir="${RUNNER_TEMP}/rusty-v8-clang"
          python3 tools/clang/scripts/update.py --output-dir "${clang_dir}"
          test -x "${clang_dir}/bin/clang"
          export CLANG_BASE_PATH="${clang_dir}"
          export LIBCLANG_PATH=/usr/lib/llvm-21/lib
          export RUSTY_V8_TARGET_SYSROOT=/usr/arm-linux-gnueabihf
          # V8 pointer compression and the sandbox require 64-bit pointers;
          # ARMv7 publishes the ordinary release artifact only.
          cargo build -vv --locked --release --target "${TARGET}"
          gzip -9c "target/${TARGET}/release/gn_out/obj/librusty_v8.a" > "${RELEASE_LIB_NAME}"
          cp "target/${TARGET}/release/gn_out/src_binding.rs" "${RELEASE_BINDING_NAME}"
      - uses: actions/upload-artifact@v6
        with:
          name: codex-armv7-assets
          path: |
            ${{ env.RELEASE_LIB_NAME }}
            ${{ env.RELEASE_BINDING_NAME }}
          if-no-files-found: error

  publish:
    name: Publish Codex Rusty V8 assets
    needs:
      - build-x64-musl
      - build-android
      - build-armv7
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: codex-*-assets
          merge-multiple: true
          path: assets
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" --title "${RELEASE_TAG}" --notes "Codex sandbox Rusty V8 artifacts"
          fi
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          files: assets/*
