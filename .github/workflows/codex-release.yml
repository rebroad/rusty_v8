name: codex-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Rusty V8 release tag to upload assets to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag against Cargo.toml
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*$/\1/p' Cargo.toml | head -n 1)"
          test -n "${version}"
          expected_tag="rusty-v8-v${version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag '${RELEASE_TAG}' does not match Cargo.toml version '${version}'." >&2
            echo "Expected: ${expected_tag}" >&2
            exit 1
          fi
          echo "release_tag=${expected_tag}" >> "${GITHUB_OUTPUT}"

  build-android:
    name: Build sandbox Android arm64
    needs: validate-release-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      V8_FROM_SOURCE: true
      TARGET: aarch64-linux-android
      ANDROID_NDK_REVISION: r28c
      ANDROID_NDK_VERSION: 28.2.13676358
      RELEASE_LIB_NAME: librusty_v8_release_aarch64-linux-android.a.gz
      RELEASE_BINDING_NAME: src_binding_release_aarch64-linux-android.rs
      LIB_NAME: librusty_v8_ptrcomp_sandbox_release_aarch64-linux-android.a.gz
      BINDING_NAME: src_binding_ptrcomp_sandbox_release_aarch64-linux-android.rs
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dsherret/rust-toolchain-file@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends unzip
          ndk_home="${RUNNER_TEMP}/android-ndk-${ANDROID_NDK_REVISION}"
          if [[ ! -x "${ndk_home}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++" ]]; then
            curl -fsSL \
              "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_REVISION}-linux.zip" \
              -o "${RUNNER_TEMP}/android-ndk.zip"
            unzip -q -o "${RUNNER_TEMP}/android-ndk.zip" -d "${RUNNER_TEMP}"
          fi
          test -x "${ndk_home}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"
      - name: Install host Clang for bindgen
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-21.list >/dev/null
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-21 libclang-21-dev
      - name: Build Android sandbox artifacts
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${TARGET}"
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
          mkdir -p third_party/android_toolchain
          ln -sfn "${ANDROID_NDK_HOME}" third_party/android_ndk
          ln -sfn ../android_ndk third_party/android_toolchain/ndk
          config_gni=build/config/android/config.gni
          if ! grep -Fq 'android_ndk_version =' "${config_gni}"; then
            sed -i \
              "s#\(  android_ndk_root = \"//third_party/android_toolchain/ndk\"\)#\1\n  android_ndk_version = \"r28\"#" \
              "${config_gni}"
          fi
          clang_dir="${RUNNER_TEMP}/rusty-v8-clang"
          python3 tools/clang/scripts/update.py --output-dir "${clang_dir}"
          test -x "${clang_dir}/bin/clang"
          export CLANG_BASE_PATH="${clang_dir}"
          export LIBCLANG_PATH=/usr/lib/llvm-21/lib
          export ANDROID_API_LEVEL=29
          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          export CC_aarch64_linux_android=aarch64-linux-android29-clang
          export CXX_aarch64_linux_android=aarch64-linux-android29-clang++
          export AR_aarch64_linux_android=llvm-ar
          export RANLIB_aarch64_linux_android=llvm-ranlib
          linker="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${linker}"
          cargo build -vv --locked --release --target "${TARGET}"
          gzip -9c "target/${TARGET}/release/gn_out/obj/librusty_v8.a" > "${RELEASE_LIB_NAME}"
          cp "target/${TARGET}/release/gn_out/src_binding.rs" "${RELEASE_BINDING_NAME}"
          sha256sum "${RELEASE_LIB_NAME}" "${RELEASE_BINDING_NAME}" > "rusty_v8_release_${TARGET}.sha256"
          cargo build -vv --locked --release --target "${TARGET}" --features v8_enable_sandbox
          gzip -9c "target/${TARGET}/release/gn_out/obj/librusty_v8.a" > "${LIB_NAME}"
          cp "target/${TARGET}/release/gn_out/src_binding.rs" "${BINDING_NAME}"
          sha256sum "${LIB_NAME}" "${BINDING_NAME}" > "rusty_v8_ptrcomp_sandbox_release_${TARGET}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: codex-android-assets
          path: |
            ${{ env.RELEASE_LIB_NAME }}
            ${{ env.RELEASE_BINDING_NAME }}
            rusty_v8_release_${{ env.TARGET }}.sha256
            ${{ env.LIB_NAME }}
            ${{ env.BINDING_NAME }}
            rusty_v8_ptrcomp_sandbox_release_${{ env.TARGET }}.sha256
          if-no-files-found: error

  build-armv7-musl:
    name: Build ARMv7 musl release
    needs: validate-release-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      V8_FROM_SOURCE: true
      TARGET: armv7-unknown-linux-musleabihf
      RELEASE_LIB_NAME: librusty_v8_release_armv7-unknown-linux-musleabihf.a.gz
      RELEASE_BINDING_NAME: src_binding_release_armv7-unknown-linux-musleabihf.rs
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dsherret/rust-toolchain-file@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install ARMv7 musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${TARGET}"
          sudo apt-get update -y
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-21.list >/dev/null
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-21 libclang-21-dev
          cat > "${RUNNER_TEMP}/armv7-musl-cc" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec zig cc -target arm-linux-musleabihf "$@"
          EOF
          cat > "${RUNNER_TEMP}/armv7-musl-cxx" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec zig c++ -target arm-linux-musleabihf "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/armv7-musl-cc" "${RUNNER_TEMP}/armv7-musl-cxx"
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=${RUNNER_TEMP}/armv7-musl-cc" >> "${GITHUB_ENV}"
          echo "CC_armv7_unknown_linux_musleabihf=${RUNNER_TEMP}/armv7-musl-cc" >> "${GITHUB_ENV}"
          echo "CXX_armv7_unknown_linux_musleabihf=${RUNNER_TEMP}/armv7-musl-cxx" >> "${GITHUB_ENV}"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "${GITHUB_ENV}"
      - name: Register ARMv7 musl Rust target with GN
        shell: bash
        run: |
          set -euo pipefail
          target_file=build/rust/known-target-triples.txt
          grep -Fxq 'thumbv7neon-unknown-linux-musleabihf' "${target_file}" || \
            sed -i '/^thumbv7neon-unknown-linux-gnueabihf$/a thumbv7neon-unknown-linux-musleabihf' "${target_file}"
      - name: Install V8 host sysroot
        run: python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
      - name: Configure ARMv7 musl bindgen sysroot
        shell: bash
        run: |
          set -euo pipefail
          zig_lib_dir="$(zig env | python3 -c 'import json, sys; print(json.load(sys.stdin)["lib_dir"])')"
          zig_libc_dir="${zig_lib_dir}/libc"
          musl_include="${zig_libc_dir}/musl/include"
          arm_include="${zig_libc_dir}/include/arm-linux-musl"
          linux_include="${zig_libc_dir}/include/arm-linux-any"
          generic_linux_include="${zig_libc_dir}/include/any-linux-any"
          generic_musl_include="${zig_libc_dir}/include/generic-musl"
          test -d "${musl_include}"
          test -d "${arm_include}"
          test -d "${linux_include}"
          test -d "${generic_linux_include}"
          test -d "${generic_musl_include}"
          sysroot="${RUNNER_TEMP}/armv7-musl-sysroot"
          mkdir -p "${sysroot}/usr/include"
          ln -s "${musl_include}"/* "${sysroot}/usr/include/"
          ln -s "${arm_include}/bits" "${sysroot}/usr/include/bits"
          for header in "${generic_musl_include}/bits"/*; do
            name="$(basename "${header}")"
            if [[ ! -e "${sysroot}/usr/include/bits/${name}" ]]; then
              ln -s "${header}" "${sysroot}/usr/include/bits/${name}"
            fi
          done
          ln -s "${linux_include}/asm" "${sysroot}/usr/include/asm"
          ln -s "${generic_linux_include}/asm-generic" "${sysroot}/usr/include/asm-generic"
          ln -s "${generic_linux_include}/linux" "${sysroot}/usr/include/linux"
          echo "RUSTY_V8_MUSL_SYSROOT=${sysroot}" >> "${GITHUB_ENV}"
      - name: Build ARMv7 musl release artifacts
        shell: bash
        run: |
          set -euo pipefail
          clang_dir="${RUNNER_TEMP}/rusty-v8-clang"
          python3 tools/clang/scripts/update.py --output-dir "${clang_dir}"
          test -x "${clang_dir}/bin/clang"
          export CLANG_BASE_PATH="${clang_dir}"
          cargo build -vv --locked --release --target "${TARGET}"
          gzip -9c "target/${TARGET}/release/gn_out/obj/librusty_v8.a" > "${RELEASE_LIB_NAME}"
          cp "target/${TARGET}/release/gn_out/src_binding.rs" "${RELEASE_BINDING_NAME}"
          sha256sum "${RELEASE_LIB_NAME}" "${RELEASE_BINDING_NAME}" > "rusty_v8_release_${TARGET}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: codex-armv7-musl-assets
          path: |
            ${{ env.RELEASE_LIB_NAME }}
            ${{ env.RELEASE_BINDING_NAME }}
            rusty_v8_release_${{ env.TARGET }}.sha256
          if-no-files-found: error

  publish:
    name: Publish Codex Rusty V8 assets
    needs:
      - validate-release-tag
      - build-android
      - build-armv7-musl
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: codex-*-assets
          merge-multiple: true
          path: assets
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" --title "${RELEASE_TAG}" --notes "Codex sandbox Rusty V8 artifacts"
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          expected_assets=(
            librusty_v8_ptrcomp_sandbox_release_aarch64-linux-android.a.gz
            src_binding_ptrcomp_sandbox_release_aarch64-linux-android.rs
            rusty_v8_ptrcomp_sandbox_release_aarch64-linux-android.sha256
            librusty_v8_release_aarch64-linux-android.a.gz
            src_binding_release_aarch64-linux-android.rs
            rusty_v8_release_aarch64-linux-android.sha256
            librusty_v8_release_armv7-unknown-linux-musleabihf.a.gz
            src_binding_release_armv7-unknown-linux-musleabihf.rs
            rusty_v8_release_armv7-unknown-linux-musleabihf.sha256
          )
          for asset in "${expected_assets[@]}"; do
            test -s "assets/${asset}" || {
              echo "Missing expected release asset: ${asset}" >&2
              exit 1
            }
          done
          gh release upload "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" \
            --clobber assets/*
